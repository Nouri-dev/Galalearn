services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galalearn_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - galalearn

  nginx:
    image: nginx:latest
    container_name: galalearn_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - galalearn

  mysql:
    image: mysql:8.0
    container_name: galalearn_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: GalaLearn
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - galalearn

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: galalearn_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - galalearn


networks:
  galalearn:


volumes:
  mysql_data: